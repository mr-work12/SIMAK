<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMAK · PK IMM FAI UM Bengkulu</title>
<meta name="description" content="Sistem Informasi Manajemen Kaderisasi · Bidang Kader PK IMM FAI UM Bengkulu">
<meta name="theme-color" content="#8b1a1a">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="SIMAK · PK IMM FAI UM Bengkulu">
<meta property="og:description" content="Sistem Informasi Manajemen Kaderisasi · Bidang Kader PK IMM FAI UM Bengkulu">
<meta property="og:image" content="ikon-512.png">
<style>
  html,body{margin:0;height:100%;background:#faf6f1;font-family:'Segoe UI',Roboto,Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #muat{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:#faf6f1;color:#2a1d1a;text-align:center;padding:16px;z-index:2;transition:opacity .4s}
  #muat img{width:110px;animation:napas 1.6s ease-in-out infinite}
  #muat h1{margin:0;font-size:20px;color:#8b1a1a}
  #muat p{margin:0;font-size:13px;color:#6b5a54}
  #muat a{display:none;margin-top:8px;background:#8b1a1a;color:#fff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px}
  #muat.lama a{display:inline-block}
  @keyframes napas{50%{transform:scale(.94);opacity:.8}}
  #pasang{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:none;
    align-items:center;gap:12px;background:#fff;color:#2a1d1a;border-radius:14px;padding:12px 14px;
    box-shadow:0 6px 24px rgba(0,0,0,.22);font-size:14px;max-width:460px;margin:0 auto}
  #pasang.tampil{display:flex}
  #pasang img{width:40px;height:40px;border-radius:10px}
  #pasang .t{flex:1;line-height:1.35}
  #pasang button{border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
  #pasang .ya{background:#8b1a1a;color:#fff}
  #pasang .tidak{background:transparent;color:#6b5a54;padding:10px 6px}
</style>
</head>
<body>
<div id="muat">
  <img src="logo.png" alt="Logo PK IMM FAI UM Bengkulu">
  <h1>SIMAK</h1>
  <p>Sistem Informasi Manajemen Kaderisasi · Bidang Kader<br>Memuat aplikasi…</p>
  <a id="langsung" href="#" target="_top" rel="noopener">Buka langsung</a>
</div>
<div id="pasang" role="dialog" aria-label="Pasang aplikasi SIMAK">
  <img src="ikon-192.png" alt="">
  <div class="t"><b>Pasang aplikasi SIMAK</b><br><span id="pasangTeks">Buka langsung dari layar utama HP, tanpa browser.</span></div>
  <button class="ya" id="pasangYa" type="button">Pasang</button>
  <button class="tidak" id="pasangTidak" type="button" aria-label="Tutup">✕</button>
</div>
<script>
  // Alamat aplikasi (Apps Script). Jika deployment baru dibuat, cukup ganti baris ini.
  var APLIKASI = 'https://script.google.com/macros/s/AKfycbwZ_vuXGrfY0n0wCbbsYnIRCTFoWvdOj9n9geBf8I6xV4eQSvDG7m6nZo2PBLR8Pb64/exec';
  // ?admin, /admin, #admin, ?tamu=K001 ... semuanya diteruskan ke aplikasi
  var q = (location.search || '').replace(/^\?/, '');
  var jalur = location.pathname.replace(/^\/+|\/+$/g, '');
  var hash = (location.hash || '').replace(/^#/, '');
  [jalur, hash].forEach(function (x) { if (x && x !== 'index.html') q = q ? q + '&' + x : x; });
  var src = APLIKASI + (q ? '?' + q : '');
  document.getElementById('langsung').href = src;
  var f = document.createElement('iframe');
  f.src = src;
  f.title = "SIMAK";
  f.allow = 'geolocation *; camera *; clipboard-write *; fullscreen *';
  f.onload = function () { var m = document.getElementById('muat'); m.style.opacity = 0; setTimeout(function () { m.remove(); }, 400); };
  document.body.appendChild(f);
  setTimeout(function () { var m = document.getElementById('muat'); if (m) { m.className = 'lama'; m.querySelector('p').textContent = 'Koneksi lambat? Ketuk tombol di bawah.'; } }, 12000);

  // ===== Jadikan aplikasi (PWA): bisa dipasang di layar utama HP =====
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
  (function () {
    var box = document.getElementById('pasang'), ya = document.getElementById('pasangYa'), tidak = document.getElementById('pasangTidak');
    var terpasang = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    var ditutup = false; try { ditutup = localStorage.getItem('simakPasangTutup') === '1'; } catch (e) {}
    if (terpasang || ditutup) return;
    var tunda = null;
    window.addEventListener('beforeinstallprompt', function (e) {     // Android / Chrome / Edge
      e.preventDefault(); tunda = e;
      setTimeout(function () { box.className = 'tampil'; }, 2500);
    });
    ya.onclick = function () {
      if (tunda) { tunda.prompt(); tunda.userChoice.then(function () { box.className = ''; tunda = null; }); }
      else box.className = '';
    };
    tidak.onclick = function () { box.className = ''; try { localStorage.setItem('simakPasangTutup', '1'); } catch (e) {} };
    window.addEventListener('appinstalled', function () { box.className = ''; });
    // iPhone (Safari) tidak punya tombol pasang otomatis: tampilkan petunjuk
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
      document.getElementById('pasangTeks').innerHTML = 'Ketuk <b>Bagikan</b> (kotak panah ke atas) lalu <b>Tambah ke Layar Utama</b>.';
      ya.textContent = 'Oke';
      setTimeout(function () { box.className = 'tampil'; }, 3000);
    }
  })();
</script>
</body>
</html>
